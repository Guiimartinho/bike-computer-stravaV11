# =============================================================================
# stravaV10 - Zephyr Project Configuration
# Bike GPS Computer with Strava Segments
# =============================================================================

# -----------------------------------------------------------------------------
# General Configuration
# -----------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024

# -----------------------------------------------------------------------------
# GPIO
# -----------------------------------------------------------------------------
CONFIG_GPIO=y

# -----------------------------------------------------------------------------
# SPI - LCD LS027 and SD Card
# -----------------------------------------------------------------------------
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# -----------------------------------------------------------------------------
# I2C - Sensors (Barometer, Accelerometer, Fuel Gauge)
# -----------------------------------------------------------------------------
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# -----------------------------------------------------------------------------
# UART - GPS Module
# -----------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_NRFX=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y

# -----------------------------------------------------------------------------
# Bluetooth Low Energy
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="stravaV10"
CONFIG_BT_DEVICE_APPEARANCE=1157
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# BT Services
CONFIG_BT_NUS=n
CONFIG_BT_LBS=n
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y

# BT GATT Client (for HRS, BSC, FEC sensors)
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# BT Settings
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
CONFIG_DISPLAY=y

# -----------------------------------------------------------------------------
# File System - SD Card
# -----------------------------------------------------------------------------
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y

# SD Card via SPI
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# -----------------------------------------------------------------------------
# Threads and Synchronization
# -----------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10

# Thread Analyzer (debug)
CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_NAME=y

# -----------------------------------------------------------------------------
# Timers and Counters
# -----------------------------------------------------------------------------
CONFIG_COUNTER=y

# -----------------------------------------------------------------------------
# Watchdog
# -----------------------------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y

# -----------------------------------------------------------------------------
# Power Management
# -----------------------------------------------------------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# -----------------------------------------------------------------------------
# Sensors Subsystem
# -----------------------------------------------------------------------------
CONFIG_SENSOR=y

# -----------------------------------------------------------------------------
# Math Library
# -----------------------------------------------------------------------------
CONFIG_CMSIS_DSP=n

# -----------------------------------------------------------------------------
# Debug Configuration
# -----------------------------------------------------------------------------
CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_ASSERT=n

# Fault handling
CONFIG_FAULT_DUMP=1
CONFIG_RESET_ON_FATAL_ERROR=y

# -----------------------------------------------------------------------------
# Build Configuration
# -----------------------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n
